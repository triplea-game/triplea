# Runs all build checks on any pull request or merges to main
name: Verify
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the parent commit too: check-custom-style checks the lines added since HEAD^1, which
          # for a pull request is the target branch
          fetch-depth: 2
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # Gradle setup adds a gradle build cache for PRs to run faster
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Build Checks
        # We skip 'spotlessApply' such that only 'spotlessCheck' will run to validate formatting.
        # This is a good setup for a CI server, meanwhile if a developer runs 'verify', they
        # will have the 'spotlessApply' task run and it will automatically format the code.
        env:
          CHECK_BASE: HEAD^1
        run: ./verify --exclude-task spotlessApply
