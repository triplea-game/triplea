# Runs when main branch is updated.
# Creates & pushes a docker container for bots.

name: Main Branch Build - Build Bot Docker Container
on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  build:
    env:
      IS_MAIN_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # Gates the push on the same checks as verify.yml. Re-running them here costs a few
      # CI minutes but keeps this a plain push-triggered job; chaining off Verify with
      # 'workflow_run' would instead run in the default-branch context and need
      # 'github.event.workflow_run.head_sha' threaded through checkout and tagging.
      - name: Run Build Checks
        run: ./verify --exclude-task spotlessApply
      - name: Login to GitHub Container Registry
        if: ${{ env.IS_MAIN_BUILD }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build headless docker container
        if: ${{ env.IS_MAIN_BUILD }}
        run: |
          ./gradlew :game-headless:shadowJar

          docker build game-app/game-headless \
            --tag ghcr.io/triplea-game/bot:latest \
            --tag ghcr.io/triplea-game/bot:sha-${{ github.sha }} \
            --label gitSha="$(git rev-parse --short HEAD)"
          docker push ghcr.io/triplea-game/bot:latest
          docker push ghcr.io/triplea-game/bot:sha-${{ github.sha }}
